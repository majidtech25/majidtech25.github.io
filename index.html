<style>
:root{--bg:#0F1B2D;--card:#16243A;--line:#24364F;--ink:#fff;--muted:#C9D4E2;--accent:#9FE3C2;--green:#4FC48D}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,"Segoe UI",system-ui,sans-serif;
  padding:24px max(16px,env(safe-area-inset-left,0px)) 40px}
.wrap{max-width:480px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-radius:18px;overflow:hidden}
.ph{display:block;width:100%;height:100%;object-fit:cover}
.a{grid-column:1/3;aspect-ratio:1080/640} .a img{object-position:50% 36%}
.b{grid-column:1/3;aspect-ratio:1080/430} .b img{object-position:50% 55%}
.c,.d{aspect-ratio:536/430} .c img{object-position:50% 40%} .d img{object-position:50% 30%}
.grid div{overflow:hidden;background:#1d2c44}
header{padding:24px 4px 18px}
.eb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
h1{font-weight:800;font-size:clamp(26px,7vw,32px);line-height:1.1;letter-spacing:-.01em;margin:0}
.un{color:var(--muted);font-weight:500;margin:4px 0 0}
.lead{color:var(--muted);margin:10px 0 0}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;min-height:68px;padding:10px 14px 10px 10px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.row:hover{border-color:var(--green);transform:translateY(-1px)}
.row:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center}
.txt{min-width:0} .txt strong{display:block;font-weight:600}
.txt small{display:block;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{font-weight:700;font-size:14px;background:var(--green);color:#06261A;padding:8px 14px;border-radius:10px}
footer{text-align:center;color:#8193AA;font-size:13px;margin-top:28px}
</style>
